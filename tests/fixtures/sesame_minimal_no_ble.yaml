# Upgrade path for an existing v0.31.0 configuration: only `sesame:` is declared.
# `esp32_ble`, `esp32_ble_tracker` and `esp32_ble_client` are auto-loaded, so no
# BLE section and no NimBLE sdkconfig_options are required any more.
esphome:
  name: sesame-minimal-test
  min_version: 2026.9.0
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  toolchain: platformio
  framework:
    type: esp-idf
external_components:
  - source:
      type: local
      path: ../../components
    components: [sesame, sesame_ble]
logger:
api:
wifi:
  ssid: test-network
  password: test-password
sesame:
  - id: sesame_one
    model: sesame_5
    uuid: "01020304-0102-0102-0102-010203040506"
    secret: "00000000000000000000000000000000"
    lock:
      id: front_lock
      name: Test Lock
    connection_sensor:
      name: Test connection
    battery_pct:
      name: Test battery
