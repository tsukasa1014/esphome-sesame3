# `always_connect: false` without an update_interval can never connect: the only
# thing that asks for a connection is update(). The component warns about it, so
# this fixture pins the warning path (and stays valid).
esphome:
  name: sesame-touch-no-interval-test
  min_version: 2026.9.0
esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  toolchain: platformio
  framework:
    type: esp-idf
external_components:
  - source:
      type: local
      path: ../../components
    components: [sesame, sesame_ble]
logger:
api:
wifi:
  ssid: test-network
  password: test-password
esp32_ble:
  max_connections: 5
esp32_ble_tracker:
sesame:
  - id: sesame_touch
    model: sesame_touch
    uuid: "01020304-0102-0102-0102-010203040506"
    secret: "00000000000000000000000000000000"
    always_connect: false
    update_interval: never
    battery_pct:
      name: Touch battery
