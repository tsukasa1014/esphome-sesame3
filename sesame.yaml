esphome:
  name: entrance
  friendly_name: Entrance
  platformio_options:
    build_flags:
      - -Wall
      - -Wextra
  min_version: 2026.9.0
external_components:
  - source:
      type: git
      # 標準BLE対応版は homy-newfs8/esphome-sesame3 ではまだリリースされていない
      # （本家は v0.31.0 / NimBLE のまま）。そのため移植版を含むforkブランチを指す。
      # v0.32.0 がタグ付けされたら本家URLとリリースタグへ戻してよい。
      url: https://github.com/tsukasa1014/esphome-sesame3
      ref: codex/esphome-standard-ble
    components: [sesame, sesame_ble]
  # - source: "components"
  #   components: [sesame, sesame_ble]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# SESAME uses ESPHome's standard BLE stack, so esp32_ble, esp32_ble_tracker,
# bluetooth_proxy and BLE presence sensors can share this ESP32.
# Do not add CONFIG_BT_NIMBLE_* options: they conflict with the standard stack.
esp32_ble:
  # One connection slot per SESAME that is connected at the same time.
  # Add the bluetooth_proxy `connection_slots` value on top of that.
  max_connections: 5

# Optional: BLE advertisement scanning / Bluetooth proxy on the same device.
# esp32_ble_tracker:
#
# bluetooth_proxy:
#   active: true
#   connection_slots: 2

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_passphrase

  ## Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sesame Fallback Hotspot"
    password: !secret wifi_fallback_password

captive_portal:

## Check memory usage
# debug:
#   update_interval: 10s
# sensor:
#   - platform: debug
#     free:
#       name: "Heap Free"
#     block:
#       name: "Heap Max Block"
#     loop_time:
#       name: "Loop Time"

## Enable logging
logger:

## Enable Home Assistant API
api:
  ## Example service to lock/unlock with various history tags specified in Home Assistant.
  ## In Home Assistant, this service will be seen as `esphome.entrance_sesame_with_tag`
  services:
    - service: sesame_with_tag
      variables:
        is_lock: bool
        tag: string
      then:
        lambda: |-
          if (is_lock) {
            id(lock_1).lock(tag);
          } else {
            id(lock_1).unlock(tag);
          }
    - service: run_bot2_script
      variables:
        script_no: int
      then:
        lambda: |-
          id(bot_2).run(script_no);

button:
  - platform: template
    name: "Run Bot2 Script1"
    on_press:
      - lambda: |-
          id(bot_2).run(0);
  - platform: template
    name: "Run Bot2 Script3"
    on_press:
      - lambda: |-
          id(bot_2).run(2);
  - platform: template
    name: "Run Bot2 Default Script"
    on_press:
      - lambda: |-
          id(bot_2).run();

## Supported devices examples
## Choose one or more you want to use
## If you need more BLE connections, raise esp32_ble `max_connections` above.
sesame:
  - id: sesame1
    ## model: Requried: sesame_5 / sesame_5_pro / sesame_touch / sesame_touch_pro / open_sensor / sesame_bike_2 / sesame_4 / sesame_3 / sesame_bot / sesame_bike
    model: sesame_5
    uuid: !secret sesame5_1_uuid
    ## public_key: Required for sesame_3 / sesame_4 / sesame_bot / sesame_bike
    ## for sesame_5 / sesame_5_pro comment out public_key line or specify any string (will be ignored)
    public_key: ""
    secret: !secret sesame5_1_secret
    lock:
      name: Lock1
      id: lock_1
      ## tag: You can specify SESAME tag (shown in history) value (default: "ESPHome").
      ## If you want to specify tag action-by-action, use lambda like:
      ##   lambda: id(lock_1).lock("More specific value")
      ## See example above api: services: section.
      tag: "My awesome system"
      ## SESAMEがこの時間だけ到達不能になったら、Home Assistantへ NONE（または
      ## unknown_state_alternative）を送る。既定は 20s。`0s` で猶予なし。
      # unknown_state_timeout: 20s
      ## 状態不明のときに NONE の代わりに JAMMED を報告する
      # unknown_state_alternative: JAMMED
      ## expose operation history tag text
      history_tag:
        name: "Lock1_history_tag"
      ## expose operation history type
      history_type:
        name: "Lock1_history_type"
      history_tag_type:
        name: "Lock1_history_tag_type"
      history_scaled_voltage:
        name: "Lock1_history_scaled_voltage"
      history_battery_pct:
        name: "Lock1_history_battery_pct"
      history_scaled_voltage2:
        name: "Lock1_history_scaled_voltage2"
      history_battery_pct2:
        name: "Lock1_history_battery_pct2"
      history_extra:
        name: "Lock1_history_extra"
    ## expose battery remaining percentage with specified name
    battery_pct:
      name: "Lock1_battery_level"
    ## expose battery voltage with specified name
    battery_voltage:
      name: "Lock1_battery_voltage"
    ## expose battery critical state as binary sensor
    battery_critical:
      name: "Lock1_battery_critical"
    ## expose SESAME connection status
    connection_sensor:
      name: "Lock1_connection"
    ##
    ## Fine adjustment parameters
    ##
    ## BLE connection timeout
    # timeout: 10s
    ## 連続してこの回数だけ接続に失敗すると、再試行間隔を60秒固定にし、カウンタを
    ## リセットする（0 = 固定へ切り替えず、3s〜48s＋ゆらぎの指数バックオフのみ）。
    ## ESP32の再起動はしない。コントローラ停滞からの復旧はESPHomeのBLEスタック
    ## 再起動で行う。
    # connect_retry_limit: 0

  ## 1台のESP32で複数のSESAMEを指定・操作できる。
  ## 接続できない機器はバックオフしながら再試行し、モジュールを再起動しないので、
  ## 安定した機器と不安定な機器を同じESP32に載せてよい。
  ##
  # - id: lock2
  #   model: sesame_3
  #   address: !secret sesame3_address
  #   public_key: !secret sesame3_pubkey
  #   secret: !secret sesame3_secret
  #   lock:
  #     name: Lock2
  #     id: lock_2
  #   connection_sensor:
  #     name: Lock2_connection
  # - id: bot1
  #   model: sesame_bot
  #   address: !secret sesamebot_address
  #   public_key: !secret sesamebot_pubkey
  #   secret: !secret sesamebot_secret
  #   battery_pct:
  #     name: Bot1_battery_level
  #   battery_voltage:
  #     name: Bot1_battery_voltage
  #   lock:
  #     name: Bot1
  #     id: bot_1
  # - id: bike1
  #   model: sesame_bike
  #   address: !secret sesamebike_address
  #   public_key: !secret sesamebike_pubkey
  #   secret: !secret sesamebike_secret
  #   lock:
  #     name: Bike1
  #     id: bike_1
  # - id: touch1
  #   model: sesame_touch
  #   secret: !secret touch_secret
  #   uuid: !secret touch_uuid
  #   always_connect: false
  #   update_interval: 12h
  #   battery_pct:
  #     name: Touch1_battery_level
  #   battery_voltage:
  #     name: Touch1_battery_voltage
  #   connection_sensor:
  #     name: Touch1_connection
  # - id: lock3
  #   model: sesame_5
  #   uuid: !secret sesame5_1_uuid
  #   secret: !secret sesame5_1_secret
  #   lock:
  #     id: lock_3
  #     name: Lock3
  #   battery_pct:
  #     name: "Lock3_battery_level"
  - id: bot2
    model: sesame_bot_2
    uuid: !secret bot2_uuid
    secret: !secret bot2_secret
    bot:
      id: bot_2
